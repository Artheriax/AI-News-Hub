<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#161616" />
  <title>Page not found · AI News Hub</title>
  <link rel="icon" href="/AI-News-Hub/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/AI-News-Hub/styles.css" />
  <style>
    .nf {
      min-height: 70vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 3rem 1rem;
    }
    .nf-mark {
      width: 72px;
      height: 72px;
      margin-inline: auto;
    }
    .nf h1 {
      margin: 1.2rem 0 0.4rem;
      font-size: 1.6rem;
      font-weight: 600;
    }
    .nf h1 span {
      color: var(--magenta);
    }
    .nf p {
      margin: 0 0 1.4rem;
      color: var(--text-muted);
    }
    .nf a.home {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      background: var(--yellow);
      color: #161616;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    .nf a.home:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <svg class="nf-mark" viewBox="0 0 42 42" aria-hidden="true">
        <circle cx="16" cy="16" r="10.5" fill="none" stroke="#ffd60a" stroke-width="3" />
        <circle cx="26" cy="16" r="10.5" fill="none" stroke="#ff2d95" stroke-width="3" opacity="0.9" />
        <circle cx="21" cy="26" r="10.5" fill="none" stroke="#00e5ff" stroke-width="3" opacity="0.9" />
      </svg>
      <h1>Lost in the <span>feed</span></h1>
      <p>That page doesn't exist — but the headlines do.</p>
      <a class="home" href="/AI-News-Hub/">Back to AI News Hub</a>
    </div>
  </main>
</body>
</html>
