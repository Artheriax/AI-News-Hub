# Curated "Use model X for Y" picks.
# Benchmark winners are snapshots (2026-10-16) inspired by the taxonomy at
# https://aireleasetracker.com/benchmark — scores stay attributed via
# benchmark_url + source_note and are NOT live-scraped (see README).
# Image/Video/Speech/Music winners mirror our own Artificial Analysis
# leaderboards in data/items.json (top-1 closed + open boards).
# Update a winner by editing the 4 fields below; fetch.py merges this file
# into data/items.json as `best_picks` (no network needed for tasks).

updated_at: "2026-10-16T00:00:00+00:00"

# Slug patterns (lowercase, substring match on normalized model name) that
# classify a model as open-weights. Everything else renders as closed-source.
# Keep conservative: unknown models fall back to "closed" with no badge claim.
open_patterns:
  - "open"
  - "oss"
  - "gpt-oss"
  - "deepseek"
  - "qwen"
  - "glm"
  - "kimi"
  - "mistral"
  - "miMo"
  - "mimo"
  - "llama"
  - "nemotron"
  - "solar open"
  - "breeze tts"
  - "qwen-image"

